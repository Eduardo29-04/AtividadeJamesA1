# ==========================================
# SocialConnect API - Configuração de Testes
# ==========================================

spring.application.name=socialconnect-api-test

# Banco H2 isolado para testes
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA para testes (sem mostrar SQL para manter o log limpo)
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

# Desabilita o console H2 e o Swagger nos testes para economizar recursos
spring.h2.console.enabled=false
springdoc.api-docs.enabled=false
