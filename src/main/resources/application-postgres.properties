spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/socialconnect}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${DB_USERNAME:socialconnect}
spring.datasource.password=${DB_PASSWORD:socialconnect}
spring.jpa.hibernate.ddl-auto=validate
spring.h2.console.enabled=false
